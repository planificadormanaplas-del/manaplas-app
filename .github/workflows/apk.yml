# Compila el APK de Android cada vez que se sube un cambio de la app a main,
# y lo publica en "Releases" para descargarlo e instalarlo en el teléfono.
# Enlace fijo a la última versión:
#   https://github.com/planificadormanaplas-del/manaplas-app/releases/latest/download/Manaplas.apk
name: Construir APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'api/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Versión de la app
        id: ver
        run: |
          V=$(grep -oP "VERSION:\s*'\K[^']+" js/config.js)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versión $V · compilación ${{ github.run_number }}"

      - name: Preparar archivos web y proyecto Android
        run: |
          npm ci
          node scripts/build-www.js
          npx cap sync android

      - name: Llave de firma
        id: firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/manaplas.keystore"
            echo "path=$RUNNER_TEMP/manaplas.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_B64: se compila con firma de prueba (debug)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.firma.outputs.path }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Manaplas.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Manaplas.apk
          fi

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Manaplas ${{ steps.ver.outputs.version }}
          make_latest: true
          files: Manaplas.apk
          body: |
            **Descargar e instalar:** toca `Manaplas.apk` abajo desde el teléfono Android.
            Compilación ${{ github.run_number }} · ${{ github.sha }}
